name: Build Windows Test EXE

on:
  workflow_dispatch:
  push:
    branches:
      - dincer552-fix-github-updates

permissions:
  contents: write

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
          cache-dependency-path: requirements.txt
      - name: Install dependencies
        run: python -m pip install -r requirements.txt pyinstaller pytest
      - name: Validate status and GUI source
        shell: pwsh
        run: |
          python -m pytest -q tests/test_status.py
          python -m py_compile status.py motor_compare.py desktop_app.py desktop_grouped_app.py
          python -c "import desktop_app; import desktop_grouped_app; import voclean_project_selector; from status import install_status_display; assert hasattr(desktop_grouped_app.GroupedApp, '_build_voclean_tab'); print('Source validation OK')"
      - name: Embed build metadata
        shell: pwsh
        env:
          APP_VERSION: v0.5.4.${{ github.run_number }}
        run: |
          Set-Content -Path build_info.py -Value @(
            '"""Build metadata embedded in packaged applications."""'
            'import pdf_click_opener  # noqa: F401'
            'import pdf_hover_indicator  # noqa: F401'
            'import status  # noqa: F401'
            'import button_label_fix  # noqa: F401'
            "BUILD_SHA = `"$env:GITHUB_SHA`""
            "BUILD_VERSION = `"$env:APP_VERSION`""
          ) -Encoding UTF8
          python -c "import build_info; import status; print('Build metadata imports central status renderer')"
      - name: Build EXE
        shell: pwsh
        env:
          APP_VERSION: v0.5.4.${{ github.run_number }}
        run: pyinstaller --noconfirm --clean --onefile --windowed --additional-hooks-dir=. --collect-all pypdf --name "PDF_KW_Selector_$env:APP_VERSION" desktop_grouped_app.py
      - name: Smoke test packaged EXE startup
        shell: pwsh
        env:
          APP_VERSION: v0.5.4.${{ github.run_number }}
        run: |
          $exe = Join-Path $PWD "dist/PDF_KW_Selector_$env:APP_VERSION.exe"
          if (-not (Test-Path -LiteralPath $exe)) { throw "Packaged EXE not found: $exe" }
          Write-Host "Starting packaged EXE smoke test: $exe"
          $proc = Start-Process -FilePath $exe -PassThru
          Start-Sleep -Seconds 12
          if ($proc.HasExited) { throw "Packaged EXE crashed/exited during startup smoke test. ExitCode=$($proc.ExitCode)" }
          Write-Host "Packaged EXE stayed running for 12 seconds: startup OK"
          Stop-Process -Id $proc.Id -Force -ErrorAction SilentlyContinue
          Start-Sleep -Seconds 2
      - name: Prepare release assets
        shell: pwsh
        env:
          APP_VERSION: v0.5.4.${{ github.run_number }}
        run: |
          $source = "dist/PDF_KW_Selector_$env:APP_VERSION.exe"
          Copy-Item $source dist/PDF_KW_Selector_latest.exe
          Copy-Item $source "dist/PDF_KW_Selector_$env:GITHUB_SHA.exe"
          Compress-Archive -Path $source -DestinationPath "dist/PDF_KW_Selector_$env:GITHUB_SHA.zip" -CompressionLevel Optimal
      - name: Publish latest release
        env:
          GH_TOKEN: ${{ github.token }}
          APP_VERSION: v0.5.4.${{ github.run_number }}
        shell: bash
        run: |
          if gh release view latest >/dev/null 2>&1; then
            gh release upload latest dist/PDF_KW_Selector_latest.exe --clobber
            gh release upload latest "dist/PDF_KW_Selector_${GITHUB_SHA}.exe" --clobber
            gh release upload latest "dist/PDF_KW_Selector_${GITHUB_SHA}.zip" --clobber
            gh release edit latest --title "PDF kW Selector $APP_VERSION - Latest" --notes "Version: $APP_VERSION; Build: $GITHUB_SHA; Centralized status rules and renderer."
          else
            gh release create latest dist/PDF_KW_Selector_latest.exe "dist/PDF_KW_Selector_${GITHUB_SHA}.exe" "dist/PDF_KW_Selector_${GITHUB_SHA}.zip" --target "$GITHUB_SHA" --title "PDF kW Selector $APP_VERSION - Latest" --notes "Version: $APP_VERSION; Build: $GITHUB_SHA; Centralized status rules and renderer."
          fi
      - uses: actions/upload-artifact@v4
        with:
          name: PDF_KW_Selector_v0.5.4_Windows
          path: dist/PDF_KW_Selector_v0.5.4.${{ github.run_number }}.exe
  deploy-update:
    needs: build-windows
    runs-on: self-hosted
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: PDF_KW_Selector_v0.5.4_Windows
          path: update-dist
      - name: Publish VM update manifest
        shell: bash
        env:
          UPDATE_ROOT: /var/www/pdf-selector-updates
          BUILD_SHA: ${{ github.sha }}
          VERSION: v0.5.4.${{ github.run_number }}
        run: |
          set -euo pipefail
          exe="update-dist/PDF_KW_Selector_v0.5.4.${{ github.run_number }}.exe"
          size="$(stat -c '%s' "$exe")"
          sha="$(sha256sum "$exe" | awk '{print $1}')"
          name="PDF_KW_Selector_${VERSION}_${BUILD_SHA}.exe"
          chunk_prefix="${name}.part"
          install -m 0644 "$exe" "$UPDATE_ROOT/.${name}.tmp"
          rm -f "$UPDATE_ROOT/${chunk_prefix}"*
          split -b 256k -d -a 3 "$exe" "$UPDATE_ROOT/.${chunk_prefix}"
          chunks_json="["
          index=0
          for chunk in "$UPDATE_ROOT"/.${chunk_prefix}*; do
            suffix="$(printf '%03d' "$index")"
            public_name="${chunk_prefix}${suffix}"
            mv -f "$chunk" "$UPDATE_ROOT/$public_name"
            chunk_size="$(stat -c '%s' "$UPDATE_ROOT/$public_name")"
            if [ "$index" -gt 0 ]; then chunks_json+=","; fi
            chunks_json+="{\"file\":\"$public_name\",\"size\":$chunk_size}"
            index=$((index + 1))
          done
          chunks_json+="]"
          printf '{"version":"%s","build":"%s","file":"%s","size":%s,"sha256":"%s","chunks":%s}\n' "$VERSION" "$BUILD_SHA" "$name" "$size" "$sha" "$chunks_json" > "$UPDATE_ROOT/.manifest.json.tmp"
          mv -f "$UPDATE_ROOT/.${name}.tmp" "$UPDATE_ROOT/$name"
          mv -f "$UPDATE_ROOT/.manifest.json.tmp" "$UPDATE_ROOT/manifest.json"
          find "$UPDATE_ROOT" -maxdepth 1 -type f -name 'PDF_KW_Selector_*.exe' ! -name "$name" ! -name 'PDF_KW_Selector_latest.exe' -delete
          find "$UPDATE_ROOT" -maxdepth 1 -type f -name 'PDF_KW_Selector_*.exe.part*' ! -name "${name}.part*" -delete
          install -m 0644 "$UPDATE_ROOT/$name" "$UPDATE_ROOT/PDF_KW_Selector_latest.exe"
