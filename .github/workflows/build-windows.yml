name: Build Windows Test EXE

on:
  workflow_dispatch:
  push:
    branches:
      - dincer552-fix-github-updates

permissions:
  contents: write

# Shared branch build: do not cancel another commit's build.
# This repository uses dincer552-fix-github-updates as its only/default branch.
# Regression tests are intentionally disabled; builds are validated by the live EXE test.
# Equipment discovery uses field-first extraction with filename fallback for varied Systemair formats.

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Verify checkout
        shell: bash
        run: git rev-parse HEAD
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pyinstaller
      - name: Embed build metadata
        shell: pwsh
        run: |
          Set-Content -Path build_info.py -Value '"""Build metadata embedded in packaged applications."""', 'BUILD_SHA = "$env:GITHUB_SHA"'
      - name: Build EXE
        run: pyinstaller --noconfirm --clean --onefile --windowed --additional-hooks-dir=. --collect-all pypdf --name PDF_KW_Selector_v0.5.4 desktop_grouped_app.py
      - name: Prepare release assets
        if: github.ref == 'refs/heads/dincer552-fix-github-updates'
        shell: pwsh
        run: |
          Copy-Item dist/PDF_KW_Selector_v0.5.4.exe dist/PDF_KW_Selector_latest.exe
          Copy-Item dist/PDF_KW_Selector_v0.5.4.exe "dist/PDF_KW_Selector_$env:GITHUB_SHA.exe"
          Compress-Archive -Path dist/PDF_KW_Selector_v0.5.4.exe -DestinationPath "dist/PDF_KW_Selector_$env:GITHUB_SHA.zip" -CompressionLevel Optimal
      - name: Publish latest release
        if: github.ref == 'refs/heads/dincer552-fix-github-updates'
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          if gh release view latest >/dev/null 2>&1; then
            gh release upload latest dist/PDF_KW_Selector_latest.exe --clobber
            gh release upload latest "dist/PDF_KW_Selector_${GITHUB_SHA}.exe"
            gh release upload latest "dist/PDF_KW_Selector_${GITHUB_SHA}.zip"
            gh release edit latest --title "PDF kW Selector v0.5.4 - Latest" --notes "Version: v0.5.4; Build: $GITHUB_SHA; Latest Windows build from dincer552-fix-github-updates."
          else
            gh release create latest dist/PDF_KW_Selector_latest.exe "dist/PDF_KW_Selector_${GITHUB_SHA}.exe" "dist/PDF_KW_Selector_${GITHUB_SHA}.zip" --target "$GITHUB_SHA" --title "PDF kW Selector v0.5.4 - Latest" --notes "Version: v0.5.4; Build: $GITHUB_SHA; Latest Windows build from dincer552-fix-github-updates."
          fi
      - uses: actions/upload-artifact@v4
        with:
          name: PDF_KW_Selector_v0.5.4_Windows
          path: dist/PDF_KW_Selector_v0.5.4.exe
  deploy-update:
    needs: build-windows
    runs-on: self-hosted
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: PDF_KW_Selector_v0.5.4_Windows
          path: update-dist
      - name: Publish VM update manifest
        shell: bash
        env:
          UPDATE_ROOT: /var/www/pdf-selector-updates
          BUILD_SHA: ${{ github.sha }}
          VERSION: v0.5.4
        run: |
          set -euo pipefail
          exe="update-dist/PDF_KW_Selector_v0.5.4.exe"
          size="$(stat -c '%s' "$exe")"
          sha="$(sha256sum "$exe" | awk '{print $1}')"
          name="PDF_KW_Selector_${VERSION}_${BUILD_SHA}.exe"
          install -m 0644 "$exe" "$UPDATE_ROOT/.${name}.tmp"
          printf '{"version":"%s","build":"%s","file":"%s","size":%s,"sha256":"%s"}\n' \
            "$VERSION" "$BUILD_SHA" "$name" "$size" "$sha" > "$UPDATE_ROOT/.manifest.json.tmp"
          mv -f "$UPDATE_ROOT/.${name}.tmp" "$UPDATE_ROOT/$name"
          mv -f "$UPDATE_ROOT/.manifest.json.tmp" "$UPDATE_ROOT/manifest.json"
          find "$UPDATE_ROOT" -maxdepth 1 -type f -name 'PDF_KW_Selector_*.exe' \
            ! -name "$name" ! -name 'PDF_KW_Selector_latest.exe' -delete
          install -m 0644 "$UPDATE_ROOT/$name" "$UPDATE_ROOT/PDF_KW_Selector_latest.exe"
