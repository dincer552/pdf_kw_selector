name: Build Windows Test EXE

on:
  workflow_dispatch:
  push:
    branches:
      - dincer552-fix-github-updates

permissions:
  contents: write

jobs:
  build-windows:
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Setup MSBuild
        uses: microsoft/setup-msbuild@v2

      - name: Install dependencies
        shell: pwsh
        run: python -m pip install -r requirements.txt pyinstaller pytest

      - name: Build integrated Test Kontrol
        shell: pwsh
        run: |
          $repo = 'https://github.com/dincer552/umut-test-pro.git'
          $commit = 'b6699e550189db140557f2ed013e48eb7c6458a3'
          New-Item -ItemType Directory -Force -Path external | Out-Null
          git clone --no-checkout --filter=blob:none $repo external/umut-test-pro
          git -C external/umut-test-pro fetch --depth 1 origin $commit
          git -C external/umut-test-pro checkout $commit

          $form = 'external/umut-test-pro/TestKontrolProg/Form1.cs'
          $helper2 = 'external/umut-test-pro/TestKontrolProg/helperFuncs2.cs'
          (Get-Content -LiteralPath $form -Raw -Encoding UTF8).Replace('using Microsoft.Office.Core;' + [Environment]::NewLine, '') | Set-Content -LiteralPath $form -Encoding UTF8
          (Get-Content -LiteralPath $helper2 -Raw -Encoding UTF8).Replace('using Microsoft.Office.Core;' + [Environment]::NewLine, '') | Set-Content -LiteralPath $helper2 -Encoding UTF8

          $csproj = 'external/umut-test-pro/TestKontrolProg/TestKontrolProg.csproj'
          $project = Get-Content -LiteralPath $csproj -Raw -Encoding UTF8
          $project = [regex]::Replace($project, '(?s)\s*<ItemGroup>\s*<COMReference Include="Microsoft\.Office\.Core">.*?</COMReference>\s*<COMReference Include="Microsoft\.Office\.Interop\.Excel">.*?</COMReference>\s*<COMReference Include="VBIDE">.*?</COMReference>\s*</ItemGroup>', '')
          Set-Content -LiteralPath $csproj -Value $project -Encoding UTF8

          nuget restore external/umut-test-pro/TestKontrolProg.sln
          msbuild external/umut-test-pro/TestKontrolProg.sln /m /p:Configuration=Release /p:Platform="Any CPU"
          $source = 'external/umut-test-pro/TestKontrolProg/bin/Release'
          $exe = Join-Path $source 'TestKontrolProg.exe'
          if (-not (Test-Path -LiteralPath $exe)) { throw "TestKontrolProg.exe was not produced: $source" }
          New-Item -ItemType Directory -Force -Path bundled/TestKontrolProg | Out-Null
          Copy-Item -Path "$source/*" -Destination bundled/TestKontrolProg -Recurse -Force

      - name: Add TEST KONTROL button
        shell: pwsh
        run: |
          $path = 'desktop_grouped_app.py'
          $text = Get-Content -Path $path -Raw -Encoding UTF8
          $anchor = 'if __name__ == "__main__":'
          if (-not $text.Contains($anchor)) { throw 'desktop_grouped_app.py entry point was not found.' }
          if (-not $text.Contains('install_test_control_button')) {
            $inject = @'
from test_control_launcher import install_test_control_button
_original_grouped_init = GroupedApp.__init__
def _grouped_init_with_test_control(self):
    _original_grouped_init(self)
    install_test_control_button(self)
GroupedApp.__init__ = _grouped_init_with_test_control

'@
            $text = $text.Replace($anchor, $inject + $anchor)
            Set-Content -Path $path -Value $text -Encoding UTF8
          }
          python -m py_compile desktop_grouped_app.py test_control_launcher.py

      - name: Run tests
        shell: pwsh
        run: |
          python -c "from status import is_match_status; assert is_match_status('MATCH'); assert not is_match_status('MISMATCH'); print('Status checks OK')"
          python -m py_compile status.py motor_compare.py desktop_app.py desktop_grouped_app.py test_control_launcher.py
          python -m pytest -q tests/test_status.py

      - name: Build EXE
        shell: pwsh
        env:
          APP_VERSION: v0.5.4.${{ github.run_number }}
        run: |
          pyinstaller --noconfirm --clean --onefile --windowed --additional-hooks-dir=. --collect-all pypdf --add-data "bundled/TestKontrolProg;TestKontrolProg" --name "PDF_KW_Selector_$env:APP_VERSION" desktop_grouped_app.py

      - name: Verify package
        shell: pwsh
        env:
          APP_VERSION: v0.5.4.${{ github.run_number }}
        run: |
          $exe = Join-Path $PWD "dist/PDF_KW_Selector_$env:APP_VERSION.exe"
          if (-not (Test-Path -LiteralPath $exe)) { throw "Packaged EXE not found: $exe" }
          if (-not (Test-Path -LiteralPath 'bundled/TestKontrolProg/TestKontrolProg.exe')) { throw 'Integrated TestKontrolProg.exe missing' }

      - name: Smoke test
        shell: pwsh
        env:
          APP_VERSION: v0.5.4.${{ github.run_number }}
        run: |
          $exe = Join-Path $PWD "dist/PDF_KW_Selector_$env:APP_VERSION.exe"
          $proc = Start-Process -FilePath $exe -PassThru
          Start-Sleep -Seconds 12
          if ($proc.HasExited) { throw "Packaged EXE exited during startup. ExitCode=$($proc.ExitCode)" }
          Stop-Process -Id $proc.Id -Force -ErrorAction SilentlyContinue

      - name: Prepare release assets
        shell: pwsh
        env:
          APP_VERSION: v0.5.4.${{ github.run_number }}
        run: |
          $source = "dist/PDF_KW_Selector_$env:APP_VERSION.exe"
          Copy-Item $source dist/PDF_KW_Selector_latest.exe
          Copy-Item $source "dist/PDF_KW_Selector_$env:GITHUB_SHA.exe"
          Compress-Archive -Path $source -DestinationPath "dist/PDF_KW_Selector_$env:GITHUB_SHA.zip" -CompressionLevel Optimal

      - name: Publish latest release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          APP_VERSION: v0.5.4.${{ github.run_number }}
        run: |
          if gh release view latest >/dev/null 2>&1; then
            gh release upload latest dist/PDF_KW_Selector_latest.exe --clobber
            gh release upload latest "dist/PDF_KW_Selector_${GITHUB_SHA}.exe" --clobber
            gh release upload latest "dist/PDF_KW_Selector_${GITHUB_SHA}.zip" --clobber
            gh release edit latest --title "PDF kW Selector $APP_VERSION - Latest" --notes "Version: $APP_VERSION; Build: $GITHUB_SHA; Integrated Test Kontrol."
          else
            gh release create latest dist/PDF_KW_Selector_latest.exe "dist/PDF_KW_Selector_${GITHUB_SHA}.exe" "dist/PDF_KW_Selector_${GITHUB_SHA}.zip" --target "$GITHUB_SHA" --title "PDF kW Selector $APP_VERSION - Latest" --notes "Version: $APP_VERSION; Build: $GITHUB_SHA; Integrated Test Kontrol."
          fi

      - name: Upload Windows artifact
        uses: actions/upload-artifact@v4
        with:
          name: PDF_KW_Selector_v0.5.4_Windows
          path: dist/PDF_KW_Selector_v0.5.4.${{ github.run_number }}.exe
