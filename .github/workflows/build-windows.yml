name: Build Windows Test EXE

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - dincer552-fix-github-updates

permissions:
  contents: write

# Do not cancel/queue builds from another commit on the same branch.
# Copilot and ChatGPT can therefore push/build independently; each run
# checks out the exact commit that triggered it.

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Verify checkout
        shell: bash
        run: git rev-parse HEAD
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pyinstaller pytest
      - name: Run regression tests
        run: pytest -q
      - name: Build EXE
        run: pyinstaller --noconfirm --clean --onefile --windowed --additional-hooks-dir=. --name PDF_KW_Selector_v0.5.3 desktop_grouped_app.py
      - name: Prepare release assets
        if: github.ref == 'refs/heads/main'
        shell: pwsh
        run: |
          Copy-Item dist/PDF_KW_Selector_v0.5.3.exe dist/PDF_KW_Selector_latest.exe
          Copy-Item dist/PDF_KW_Selector_v0.5.3.exe "dist/PDF_KW_Selector_$env:GITHUB_SHA.exe"
          Compress-Archive -Path dist/PDF_KW_Selector_v0.5.3.exe -DestinationPath "dist/PDF_KW_Selector_$env:GITHUB_SHA.zip" -CompressionLevel Optimal
      - name: Publish latest release
        if: github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          if gh release view latest >/dev/null 2>&1; then
            gh release upload latest dist/PDF_KW_Selector_latest.exe --clobber
            gh release upload latest "dist/PDF_KW_Selector_${GITHUB_SHA}.exe"
            gh release upload latest "dist/PDF_KW_Selector_${GITHUB_SHA}.zip"
            gh release edit latest --title "PDF kW Selector - Latest" --notes "Latest Windows build from main. Commit: $GITHUB_SHA"
          else
            gh release create latest dist/PDF_KW_Selector_latest.exe "dist/PDF_KW_Selector_${GITHUB_SHA}.exe" "dist/PDF_KW_Selector_${GITHUB_SHA}.zip" --target "$GITHUB_SHA" --title "PDF kW Selector - Latest" --notes "Latest Windows build from main. Commit: $GITHUB_SHA"
          fi
      - uses: actions/upload-artifact@v4
        with:
          name: PDF_KW_Selector_v0.5.3_Windows
          path: dist/PDF_KW_Selector_v0.5.3.exe
