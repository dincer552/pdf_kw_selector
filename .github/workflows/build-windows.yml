name: Build Windows Test EXE

on:
  workflow_dispatch:
  push:
    branches: [ main ]

permissions:
  contents: write

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Verify checkout
        shell: bash
        run: git rev-parse HEAD
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pyinstaller pytest
      - name: Run tests
        run: pytest -q
      - name: Build EXE
        run: pyinstaller --noconfirm --clean --onefile --windowed --name PDF_KW_Selector_v0.5.3 desktop_app.py
      - name: Prepare latest updater asset
        shell: pwsh
        run: Copy-Item dist/PDF_KW_Selector_v0.5.3.exe dist/PDF_KW_Selector_latest.exe
      - name: Publish latest release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          if gh release view latest >/dev/null 2>&1; then
            gh release upload latest dist/PDF_KW_Selector_latest.exe --clobber
            gh release edit latest --title "PDF kW Selector - Latest" --notes "Latest CI-tested Windows build from main. Commit: $GITHUB_SHA"
          else
            gh release create latest dist/PDF_KW_Selector_latest.exe --target "$GITHUB_SHA" --title "PDF kW Selector - Latest" --notes "Latest CI-tested Windows build from main. Commit: $GITHUB_SHA"
          fi
      - uses: actions/upload-artifact@v4
        with:
          name: PDF_KW_Selector_v0.5.3_Windows
          path: dist/PDF_KW_Selector_v0.5.3.exe
