name: Build Windows Test EXE

on:
  workflow_dispatch:
  push:
    branches: [ main ]

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Verify checkout
        shell: bash
        run: git rev-parse HEAD
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pyinstaller pytest
      - name: Run tests
        run: pytest -q
      - name: Build EXE
        run: pyinstaller --noconfirm --clean --onefile --windowed --name PDF_KW_Selector_v0.5.1 desktop_app.py
      - uses: actions/upload-artifact@v4
        with:
          name: PDF_KW_Selector_v0.5.1_Windows
          path: dist/PDF_KW_Selector_v0.5.1.exe
