name: Build Windows Test EXE

on:
  workflow_dispatch:
  push:
    branches:
      - dincer552-fix-github-updates

permissions:
  contents: write

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Verify checkout
        shell: bash
        run: git rev-parse HEAD
      - name: Remove stale Python bytecode
        shell: pwsh
        run: |
          Get-ChildItem -Path . -Recurse -Directory -Filter __pycache__ -ErrorAction SilentlyContinue | Remove-Item -Recurse -Force -ErrorAction SilentlyContinue
          Get-ChildItem -Path . -Recurse -File -Filter *.pyc -ErrorAction SilentlyContinue | Remove-Item -Force -ErrorAction SilentlyContinue
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
          cache-dependency-path: requirements.txt
      - name: Install dependencies
        run: python -m pip install -r requirements.txt pyinstaller
      - name: Fix Tk confirmation thread usage
        shell: pwsh
        run: |
          $path = 'desktop_app.py'
          $text = Get-Content -Path $path -Raw -Encoding UTF8
          $old = 'threading.Thread(target=self._analyze_background,args=(pdf1_paths,pdf2_paths),daemon=True).start()'
          $new = 'self._analyze_background(pdf1_paths,pdf2_paths)'
          if (-not $text.Contains($old)) { throw 'Tk thread fix target was not found.' }
          Set-Content -Path $path -Value $text.Replace($old,$new) -Encoding UTF8
          python -m py_compile desktop_app.py
      - name: Keep normal AHU group available after VOCLEAN selection
        shell: pwsh
        run: |
          $path = 'confirmation_workflow.py'
          $text = Get-Content -Path $path -Raw -Encoding UTF8
          $nl = [Environment]::NewLine
          $old = '            used_left.add(left_key)' + $nl + '            used_right.add(right_key)' + $nl + '            info("Onaylı proje grupları birleştirildi", left=left_project.project_name, right=right_project.project_name, left_key=left_key, right_key=right_key)'
          $new = '            if (left_key, right_key) not in voclean_approved: used_left.add(left_key)' + $nl + '            used_right.add(right_key)' + $nl + '            info("Onaylı proje grupları birleştirildi", left=left_project.project_name, right=right_project.project_name, left_key=left_key, right_key=right_key, voclean_override=(left_key, right_key) in voclean_approved)'
          if (-not $text.Contains($old)) { throw 'VOCLEAN grouping target was not found.' }
          Set-Content -Path $path -Value $text.Replace($old,$new) -Encoding UTF8
          python -m py_compile confirmation_workflow.py
      - name: Enable clickable VOCLEAN project selector
        shell: pwsh
        run: |
          $path = 'desktop_grouped_app.py'
          $text = Get-Content -Path $path -Raw -Encoding UTF8
          $old = 'from updater import apply_update' + [Environment]::NewLine + 'from confirmation_workflow import analyze_with_confirmations'
          $new = 'from updater import apply_update' + [Environment]::NewLine + 'import voclean_project_selector' + [Environment]::NewLine + 'from confirmation_workflow import analyze_with_confirmations'
          if (-not $text.Contains($old)) { throw 'Grouped app VOCLEAN import target was not found.' }
          Set-Content -Path $path -Value $text.Replace($old,$new) -Encoding UTF8
          python -m py_compile desktop_grouped_app.py voclean_project_selector.py
      - name: Verify GUI source
        shell: pwsh
        run: |
          python -c "import desktop_app; assert callable(desktop_app.App._file_box); import desktop_grouped_app; assert issubclass(desktop_grouped_app.GroupedApp, desktop_app.App); print('GUI source verification OK')"
      - name: Embed build metadata
        shell: pwsh
        env:
          APP_VERSION: v0.5.4.${{ github.run_number }}
        run: |
          Set-Content -Path build_info.py -Value '"""Build metadata embedded in packaged applications."""', "BUILD_SHA = `"$env:GITHUB_SHA`"", "BUILD_VERSION = `"$env:APP_VERSION`""
      - name: Build EXE
        shell: pwsh
        env:
          APP_VERSION: v0.5.4.${{ github.run_number }}
        run: pyinstaller --noconfirm --clean --onefile --windowed --additional-hooks-dir=. --collect-all pypdf --name "PDF_KW_Selector_$env:APP_VERSION" desktop_grouped_app.py
      - name: Prepare release assets
        shell: pwsh
        env:
          APP_VERSION: v0.5.4.${{ github.run_number }}
        run: |
          $source = "dist/PDF_KW_Selector_$env:APP_VERSION.exe"
          Copy-Item $source dist/PDF_KW_Selector_latest.exe
          Copy-Item $source "dist/PDF_KW_Selector_$env:GITHUB_SHA.exe"
          Compress-Archive -Path $source -DestinationPath "dist/PDF_KW_Selector_$env:GITHUB_SHA.zip" -CompressionLevel Optimal
      - name: Publish latest release
        env:
          GH_TOKEN: ${{ github.token }}
          APP_VERSION: v0.5.4.${{ github.run_number }}
        shell: bash
        run: |
          if gh release view latest >/dev/null 2>&1; then
            gh release upload latest dist/PDF_KW_Selector_latest.exe --clobber
            gh release upload latest "dist/PDF_KW_Selector_${GITHUB_SHA}.exe" --clobber
            gh release upload latest "dist/PDF_KW_Selector_${GITHUB_SHA}.zip" --clobber
            gh release edit latest --title "PDF kW Selector $APP_VERSION - Latest" --notes "Version: $APP_VERSION; Build: $GITHUB_SHA; Clickable VOCLEAN project selector."
          else
            gh release create latest dist/PDF_KW_Selector_latest.exe "dist/PDF_KW_Selector_${GITHUB_SHA}.exe" "dist/PDF_KW_Selector_${GITHUB_SHA}.zip" --target "$GITHUB_SHA" --title "PDF kW Selector $APP_VERSION - Latest" --notes "Version: $APP_VERSION; Build: $GITHUB_SHA; Clickable VOCLEAN project selector."
          fi
      - uses: actions/upload-artifact@v4
        with:
          name: PDF_KW_Selector_v0.5.4_Windows
          path: dist/PDF_KW_Selector_v0.5.4.${{ github.run_number }}.exe
  deploy-update:
    needs: build-windows
    runs-on: self-hosted
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: PDF_KW_Selector_v0.5.4_Windows
          path: update-dist
      - name: Publish VM update manifest
        shell: bash
        env:
          UPDATE_ROOT: /var/www/pdf-selector-updates
          BUILD_SHA: ${{ github.sha }}
          VERSION: v0.5.4.${{ github.run_number }}
        run: |
          set -euo pipefail
          exe="update-dist/PDF_KW_Selector_v0.5.4.${{ github.run_number }}.exe"
          size="$(stat -c '%s' "$exe")"
          sha="$(sha256sum "$exe" | awk '{print $1}')"
          name="PDF_KW_Selector_${VERSION}_${BUILD_SHA}.exe"
          chunk_prefix="${name}.part"
          install -m 0644 "$exe" "$UPDATE_ROOT/.${name}.tmp"
          rm -f "$UPDATE_ROOT/${chunk_prefix}"*
          split -b 256k -d -a 3 "$exe" "$UPDATE_ROOT/.${chunk_prefix}"
          chunks_json="["
          index=0
          for chunk in "$UPDATE_ROOT"/.${chunk_prefix}*; do
            suffix="$(printf '%03d' "$index")"
            public_name="${chunk_prefix}${suffix}"
            mv -f "$chunk" "$UPDATE_ROOT/$public_name"
            chunk_size="$(stat -c '%s' "$UPDATE_ROOT/$public_name")"
            if [ "$index" -gt 0 ]; then chunks_json+=","; fi
            chunks_json+="{\"file\":\"$public_name\",\"size\":$chunk_size}"
            index=$((index + 1))
          done
          chunks_json+="]"
          printf '{"version":"%s","build":"%s","file":"%s","size":%s,"sha256":"%s","chunks":%s}\n' "$VERSION" "$BUILD_SHA" "$name" "$size" "$sha" "$chunks_json" > "$UPDATE_ROOT/.manifest.json.tmp"
          mv -f "$UPDATE_ROOT/.${name}.tmp" "$UPDATE_ROOT/$name"
          mv -f "$UPDATE_ROOT/.manifest.json.tmp" "$UPDATE_ROOT/manifest.json"
          find "$UPDATE_ROOT" -maxdepth 1 -type f -name 'PDF_KW_Selector_*.exe' ! -name "$name" ! -name 'PDF_KW_Selector_latest.exe' -delete
          find "$UPDATE_ROOT" -maxdepth 1 -type f -name 'PDF_KW_Selector_*.exe.part*' ! -name "${name}.part*" -delete
          install -m 0644 "$UPDATE_ROOT/$name" "$UPDATE_ROOT/PDF_KW_Selector_latest.exe"
