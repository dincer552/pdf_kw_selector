name: Test Kontrol Build Validation

on:
  workflow_dispatch:
  push:
    branches:
      - dincer552-fix-github-updates

jobs:
  build-test-control:
    runs-on: windows-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup MSBuild
        uses: microsoft/setup-msbuild@v2

      - name: Build TestKontrolProg
        shell: pwsh
        run: |
          $repo = 'https://github.com/dincer552/umut-test-pro.git'
          $commit = 'b6699e550189db140557f2ed013e48eb7c6458a3'
          git clone --no-checkout --filter=blob:none $repo external/umut-test-pro
          git -C external/umut-test-pro fetch --depth 1 origin $commit
          git -C external/umut-test-pro checkout $commit

          # The source has unused Office COM using directives. GitHub's hosted
          # Windows image does not register Office type libraries, so strip the
          # unused imports and COMReference block for the CI build.
          $form = 'external/umut-test-pro/TestKontrolProg/Form1.cs'
          $helper2 = 'external/umut-test-pro/TestKontrolProg/helperFuncs2.cs'
          (Get-Content -LiteralPath $form -Raw -Encoding UTF8).Replace('using Microsoft.Office.Core;' + [Environment]::NewLine, '') | Set-Content -LiteralPath $form -Encoding UTF8
          (Get-Content -LiteralPath $helper2 -Raw -Encoding UTF8).Replace('using Microsoft.Office.Core;' + [Environment]::NewLine, '') | Set-Content -LiteralPath $helper2 -Encoding UTF8

          $csproj = 'external/umut-test-pro/TestKontrolProg/TestKontrolProg.csproj'
          $project = Get-Content -LiteralPath $csproj -Raw -Encoding UTF8
          $project = [regex]::Replace($project, '(?s)\s*<ItemGroup>\s*<COMReference Include="Microsoft\.Office\.Core">.*?</COMReference>\s*<COMReference Include="Microsoft\.Office\.Interop\.Excel">.*?</COMReference>\s*<COMReference Include="VBIDE">.*?</COMReference>\s*</ItemGroup>', '')
          Set-Content -LiteralPath $csproj -Value $project -Encoding UTF8

          nuget restore external/umut-test-pro/TestKontrolProg.sln
          msbuild external/umut-test-pro/TestKontrolProg.sln /m /p:Configuration=Release /p:Platform="Any CPU"
          $exe = 'external/umut-test-pro/TestKontrolProg/bin/Release/TestKontrolProg.exe'
          if (-not (Test-Path -LiteralPath $exe)) { throw "Build output not found: $exe" }
          Write-Host "TestKontrolProg build OK: $exe"

      - name: Upload TestKontrolProg build
        uses: actions/upload-artifact@v4
        with:
          name: TestKontrolProg-Release
          path: external/umut-test-pro/TestKontrolProg/bin/Release/*
