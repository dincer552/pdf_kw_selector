name: Actions Diagnostic

on:
  workflow_dispatch:
  push:
    branches:
      - dincer552-fix-github-updates

jobs:
  diagnostic:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Diagnostic
        shell: pwsh
        run: |
          Write-Host "GitHub Actions job started successfully"
          Write-Host "SHA=$env:GITHUB_SHA"
          Get-Date
