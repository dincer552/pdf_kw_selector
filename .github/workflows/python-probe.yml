name: Python Probe

on:
  push:
    branches:
      - dincer552-fix-github-updates

jobs:
  python-probe:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - shell: pwsh
        run: python --version
