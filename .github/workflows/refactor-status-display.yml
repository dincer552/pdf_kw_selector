name: Refactor Status Display

on:
  push:
    branches:
      - dincer552-fix-github-updates

permissions:
  contents: write

jobs:
  migrate:
    if: ${{ !contains(github.event.head_commit.message, 'Refactor status display') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Refactor status display into one module
        shell: python
        run: |
          from pathlib import Path
          import re

          root = Path('.')

          status_display = '''"""Single source of truth for status-cell display in the desktop application.

The analysis engine owns the status values. This module owns only the visual
contract for every table column headed "Durum": exact MATCH is green; every
other non-empty status is red. No other GUI module should implement its own
MATCH/color decision.
"""
from __future__ import annotations

import tkinter as tk
from tkinter import font as tkfont
from tkinter import ttk


def normalize_status(value) -> str:
    return " ".join(str(value or "").split()).strip()


def is_match_status(value) -> bool:
    return normalize_status(value).casefold() == "match"


def status_badge(value) -> tuple[str, bool] | None:
    text = normalize_status(value)
    if not text:
        return None
    matched = is_match_status(text)
    return (("✓ MATCH" if matched else f"✕ {text}"), matched)


class _StatusDisplay:
    """Own all status-cell badges without modifying ttk.Treeview globally."""

    def __init__(self, app: tk.Misc):
        self.app = app
        self._trees: dict[ttk.Treeview, dict] = {}
        self._scan_job = None
        self._font = tkfont.Font(family="Segoe UI", size=8, weight="bold")
        self._scan()

    def _walk(self, widget):
        for child in widget.winfo_children():
            yield child
            yield from self._walk(child)

    def _status_columns(self, tree):
        result = []
        for column in tree["columns"]:
            heading = str(tree.heading(column, "text") or "").strip().casefold()
            if heading == "durum":
                result.append(column)
        return result

    def _attach(self, tree, columns):
        if tree in self._trees:
            self._trees[tree]["columns"] = columns
            return
        state = {"columns": columns, "labels": {}, "job": None}
        self._trees[tree] = state
        for sequence in ("<Configure>", "<Expose>", "<Visibility>", "<MouseWheel>", "<Button-4>", "<Button-5>", "<<TreeviewSelect>>"):
            tree.bind(sequence, lambda _event, t=tree: self._schedule(t), add="+")
        tree.bind("<Destroy>", lambda _event, t=tree: self._detach(t), add="+")
        self._schedule(tree)

    def _detach(self, tree):
        state = self._trees.pop(tree, None)
        if not state:
            return
        if state.get("job") is not None:
            try:
                tree.after_cancel(state["job"])
            except Exception:
                pass
        for label in list(state["labels"].values()):
            try:
                label.destroy()
            except Exception:
                pass

    def _schedule(self, tree):
        state = self._trees.get(tree)
        if not state or state.get("job") is not None:
            return
        try:
            state["job"] = tree.after_idle(lambda t=tree: self._refresh(t))
        except tk.TclError:
            self._detach(tree)

    def _refresh(self, tree):
        state = self._trees.get(tree)
        if not state:
            return
        state["job"] = None
        try:
            wanted = {}
            columns = state["columns"]
            all_columns = list(tree["columns"])
            for item in tree.get_children(""):
                for column in columns:
                    bbox = tree.bbox(item, column)
                    if not bbox:
                        continue
                    index = all_columns.index(column)
                    values = tree.item(item, "values")
                    value = values[index] if index < len(values) else ""
                    badge = status_badge(value)
                    if badge:
                        wanted[(item, column)] = (*bbox, badge[0], badge[1])

            for key, label in list(state["labels"].items()):
                if key not in wanted or not label.winfo_exists():
                    try:
                        label.destroy()
                    except Exception:
                        pass
                    state["labels"].pop(key, None)

            for key, (x, y, width, height, text, matched) in wanted.items():
                bg = "#dcfce7" if matched else "#fee2e2"
                fg = "#166534" if matched else "#991b1b"
                border = "#22c55e" if matched else "#ef4444"
                label = state["labels"].get(key)
                if label is None or not label.winfo_exists():
                    label = tk.Label(tree, font=self._font, bd=0, relief="flat", padx=8, pady=1, anchor="center")
                    state["labels"][key] = label
                label.configure(text=text, bg=bg, fg=fg, highlightthickness=1, highlightbackground=border, highlightcolor=border)
                badge_width = min(max(width - 8, 60), max(60, self._font.measure(text) + 18))
                label.place(x=x + max(4, (width - badge_width) / 2), y=y + 2, width=badge_width, height=max(20, min(24, height - 4)))
                label.lift()
        except (tk.TclError, ValueError, IndexError):
            self._detach(tree)
            return

    def _scan(self):
        try:
            for tree in list(self._walk(self.app)):
                if isinstance(tree, ttk.Treeview):
                    columns = self._status_columns(tree)
                    if columns:
                        self._attach(tree, columns)
            for tree in list(self._trees):
                if not tree.winfo_exists():
                    self._detach(tree)
                else:
                    self._schedule(tree)
            self._scan_job = self.app.after(250, self._scan)
        except tk.TclError:
            self._scan_job = None


def install_status_display(app: tk.Misc) -> None:
    """Install the single status renderer once for the complete desktop GUI."""
    existing = getattr(app, "_status_display", None)
    if existing is None:
        app._status_display = _StatusDisplay(app)
'''
          (root / 'status_display.py').write_text(status_display, encoding='utf-8')

          desktop_app = root / 'desktop_app.py'
          text = desktop_app.read_text(encoding='utf-8')
          marker = 'from pdf_hover_indicator import get_cell_hover_box'
          import_line = marker + '\nfrom status_display import install_status_display'
          if 'from status_display import install_status_display' not in text:
              if marker not in text:
                  raise SystemExit('desktop_app import marker not found')
              text = text.replace(marker, import_line, 1)
          marker2 = '        self._build_ui()\n        install_pdf_drop_targets(self, self.pdf1_box, self.pdf2_box)'
          replacement2 = '        self._build_ui()\n        install_status_display(self)\n        install_pdf_drop_targets(self, self.pdf1_box, self.pdf2_box)'
          if 'install_status_display(self)' not in text:
              if marker2 not in text:
                  raise SystemExit('desktop_app GUI init marker not found')
              text = text.replace(marker2, replacement2, 1)
          desktop_app.write_text(text, encoding='utf-8')

          # Remove the two competing, unused status-rendering systems.
          for obsolete in ('status_badges.py', 'ui_polish.py'):
              path = root / obsolete
              if path.exists():
                  path.unlink()

          test = '''import unittest\n\nfrom status_display import is_match_status, normalize_status, status_badge\n\n\nclass StatusDisplayTests(unittest.TestCase):\n    def test_only_exact_match_is_green(self):\n        self.assertTrue(is_match_status("MATCH"))\n        self.assertTrue(is_match_status(" match "))\n        for value in ("MISMATCH", "EBM_PAPST", "ONLY_IN_PDF1", "ONLY_IN_PDF2", "BA kodu eşleşti (BA550)", "PDF2 AHU eşleşmesi yok"):\n            self.assertFalse(is_match_status(value), value)\n\n    def test_badge_contract(self):\n        self.assertEqual(status_badge("MATCH"), ("✓ MATCH", True))\n        text, matched = status_badge("MISMATCH")\n        self.assertEqual((text, matched), ("✕ MISMATCH", False))\n        text, matched = status_badge("BA kodu eşleşti (BA550)")\n        self.assertEqual((text, matched), ("✕ BA kodu eşleşti (BA550)", False))\n\n    def test_normalization(self):\n        self.assertEqual(normalize_status("  PDF2   AHU eşleşmesi   yok "), "PDF2 AHU eşleşmesi yok")\n\n\nif __name__ == "__main__":\n    unittest.main()\n'''
          (root / 'test_status_display.py').write_text(test, encoding='utf-8')

          workflow = root / '.github/workflows/build-windows.yml'
          w = workflow.read_text(encoding='utf-8')
          verify_marker = '      - name: Verify GUI source\n'
          test_step = '      - name: Test status display contract\n        shell: pwsh\n        run: python -m unittest -v test_status_display.py\n'
          if 'Test status display contract' not in w:
              if verify_marker not in w:
                  raise SystemExit('workflow verify marker not found')
              w = w.replace(verify_marker, test_step + verify_marker, 1)
          workflow.write_text(w, encoding='utf-8')

          # Keep this migration one-shot: source changes remain, migration workflow does not.
          migration = root / '.github/workflows/refactor-status-display.yml'
          migration.unlink()

      - name: Verify and commit refactor
        shell: bash
        run: |
          set -euo pipefail
          python -m py_compile status_display.py desktop_app.py test_status_display.py
          python -m unittest -v test_status_display.py
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add desktop_app.py status_display.py test_status_display.py .github/workflows/build-windows.yml status_badges.py ui_polish.py .github/workflows/refactor-status-display.yml
          git commit -m 'Refactor status display into one module'
          git push